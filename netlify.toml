[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://rhockstarconnect1.netlify.app/*"
  to = "https://rhockstarconnect.com/:splat"
  status = 301
  force = true
